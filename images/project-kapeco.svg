<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Poppins, Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="500" fill="#f3e9dc"/>
  <circle cx="120" cy="420" r="160" fill="#e8d5bf"/>
  <!-- left text -->
