  <text x="326" y="106" font-size="15" font-weight="700" fill="#3b2418">What's your</text>
  <text x="326" y="124" font-size="15" font-weight="700" fill="#3b2418">coffee today?</text>
  <rect x="326" y="138" width="168" height="28" rx="14" fill="#f1e6da"/>
  <text x="342" y="156" font-size="10" fill="#9a7b66">Search coffee...</text>
  <rect x="326" y="178" width="48" height="22" rx="11" fill="#5b3a29"/>
